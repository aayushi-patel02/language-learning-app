# Render blueprint. Import this repo at dashboard.render.com/blueprints and
# Render reads this instead of you filling in the web form.
#
# Secrets are marked `sync: false`, which means Render prompts for them at
# deploy time and never stores them in the repo.
services:
  - type: web
    name: charla-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.14"

      # Generated once by Render and kept out of the repo.
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"

      # Set this to your Vercel URL after the frontend deploys, e.g.
      # https://charla.vercel.app - no trailing slash.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false

      # false, so the deployed app answers with the model. It is still safe:
      # a failed call falls back to the same hand-written bank demo mode
      # serves, so an outage degrades the lesson rather than breaking it.
      #
      # true means never calling out at all, which is worth it only for a
      # scripted run that has to be byte-identical every time. Set it in the
      # dashboard for that, and remember this file wins on the next blueprint
      # sync - shipping "true" here is how a dashboard override got quietly
      # reverted once already.
      - key: DEMO_MODE
        value: "false"

      - key: LLM_PROVIDER
        value: "groq"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "openai/gpt-oss-120b"

      - key: SESSION_TURN_LIMIT
        value: "5"
      - key: DEMO_USERNAME
        value: "demo"
